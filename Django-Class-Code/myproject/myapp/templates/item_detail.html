{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ item.name }} · {{ item.restaurant }}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #202124; background: #f6f6f6; font-family: Arial, sans-serif; }
        .app { width: min(100%, 520px); min-height: 100vh; margin: auto; padding-bottom: 84px; background: #fff; }
        .photo { position: relative; height: 280px; background: linear-gradient(#0001, #0007), url('{% static item.image %}') center/cover; }
        .back { position: absolute; top: 16px; left: 16px; width: 42px; height: 42px; border: 0; border-radius: 50%; background: #fff; font-size: 28px; cursor: pointer; }
        .content { padding: 19px 18px; } h1 { margin: 0 0 7px; font-size: 27px; } .restaurant { margin: 0 0 13px; color: #e85b20; font-size: 14px; font-weight: 700; }
        .description { margin: 0; color: #697078; font-size: 15px; line-height: 1.45; } .price { margin: 14px 0 22px; font-size: 20px; font-weight: 700; }
        .divider { height: 8px; margin: 0 -18px; background: #f6f6f6; } h2 { margin: 22px 0 6px; font-size: 19px; } .helper { margin: 0 0 15px; color: #6d737a; font-size: 13px; }
        .size { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; } .size label { display: flex; align-items: center; gap: 12px; font-weight: 600; cursor: pointer; }
        input[type=radio] { width: 19px; height: 19px; accent-color: #ec5a24; } .size-price { font-weight: 700; }
        .quantity-row { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 4px; } .quantity-row h2 { margin: 0; }
        .stepper { display: flex; align-items: center; gap: 16px; border: 1px solid #e4e4e4; border-radius: 7px; padding: 5px; } .stepper button { width: 30px; height: 30px; color: #e95a22; border: 0; border-radius: 5px; background: #fff1eb; font-size: 21px; cursor: pointer; } #quantity { min-width: 10px; font-weight: 700; text-align: center; }
        .footer { position: fixed; right: 0; bottom: 0; left: 0; display: flex; justify-content: center; pointer-events: none; } .footer-inner { display: flex; align-items: center; justify-content: space-between; width: min(100%, 520px); padding: 15px 18px; color: #fff; background: #e95720; pointer-events: auto; } .footer small { display: block; font-size: 12px; } .footer strong { display: block; margin-top: 2px; font-size: 17px; } .footer button { padding: 8px 0; color: #fff; border: 0; background: transparent; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <main class="app">
        <div class="photo"><button class="back" aria-label="Go back" onclick="history.back()">‹</button></div>
        <section class="content">
            <h1>{{ item.name }}</h1><p class="restaurant">{{ item.restaurant }}</p><p class="description">{{ item.description }}</p><p class="price" id="headline-price">₹{{ item.base_price }}</p>
            <div class="divider"></div>
            <h2>Choose Size</h2><p class="helper">Select one option</p>
            {% for size in item.sizes %}
            <div class="size"><label><input type="radio" name="size" value="{{ size.price }}" {% if forloop.first %}checked{% endif %}> {{ size.name }}</label><span class="size-price">₹{{ size.price }}</span></div>
            {% endfor %}
            <div class="quantity-row"><h2>Quantity</h2><div class="stepper"><button id="decrease" aria-label="Decrease quantity">−</button><span id="quantity">1</span><button id="increase" aria-label="Increase quantity">+</button></div></div>
        </section>
    </main>
    <footer class="footer"><div class="footer-inner"><div><small id="item-count">1 item</small><strong id="total">₹{{ item.base_price }}</strong></div><button id="add-cart">Add to Cart</button></div></footer>
    <script>
        let quantity = 1;
        const price = () => Number(document.querySelector('input[name="size"]:checked').value);
        const refresh = () => {
            document.getElementById('quantity').textContent = quantity;
            document.getElementById('item-count').textContent = `${quantity} item${quantity === 1 ? '' : 's'}`;
            document.getElementById('total').textContent = `₹${price() * quantity}`;
            document.getElementById('headline-price').textContent = `₹${price()}`;
        };
        document.getElementById('increase').onclick = () => { quantity += 1; refresh(); };
        document.getElementById('decrease').onclick = () => { if (quantity > 1) { quantity -= 1; refresh(); } };
        document.querySelectorAll('input[name="size"]').forEach(input => input.onchange = refresh);
        document.getElementById('add-cart').onclick = event => { event.currentTarget.textContent = 'Added ✓'; };
    </script>
</body>
</html>
