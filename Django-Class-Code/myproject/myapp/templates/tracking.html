<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track order · Pizza Palace</title>
    <style>
        * { box-sizing: border-box; } body { margin: 0; color: #202124; background: #f6f6f6; font-family: Arial, sans-serif; } .app { width: min(100%, 520px); min-height: 100vh; margin: auto; padding-bottom: 20px; background: #fff; } header { display: flex; align-items: center; gap: 15px; height: 67px; padding: 0 16px; border-bottom: 1px solid #eee; } .back { width: 39px; height: 39px; border: 0; border-radius: 50%; background: #f4f4f4; font-size: 26px; cursor: pointer; } h1 { margin: 0; font-size: 21px; } .map { height: 220px; position: relative; overflow: hidden; background: #e4eee4; } .road { position: absolute; width: 130%; height: 38px; background: #fff; transform: rotate(-24deg); top: 90px; left: -35px; box-shadow: 0 0 0 5px #d7e0d6; } .road.two { top: 142px; transform: rotate(26deg); } .route { position: absolute; width: 50%; height: 70px; top: 70px; left: 25%; border: 4px dashed #ec5a23; border-bottom: 0; border-radius: 70px 70px 0 0; transform: rotate(-8deg); } .pin { position: absolute; display: grid; width: 38px; height: 38px; place-items: center; border: 3px solid #fff; border-radius: 50%; color: #fff; background: #e95720; box-shadow: 0 2px 6px #0004; } .pin.restaurant { top: 61px; left: 20%; } .pin.home { right: 17%; bottom: 44px; background: #187e49; } .summary { margin: -15px 16px 16px; padding: 16px; position: relative; border-radius: 12px; background: #fff; box-shadow: 0 2px 9px #0002; } .summary p { margin: 0; color: #677078; font-size: 13px; } .summary strong { display: block; margin: 5px 0; font-size: 19px; } .eta { color: #167c45; font-weight: 700; } .section { margin: 20px 17px; } h2 { margin: 0 0 15px; font-size: 18px; } .timeline { padding-left: 3px; } .step { display: grid; grid-template-columns: 23px 1fr auto; column-gap: 12px; min-height: 75px; } .dot { position: relative; width: 19px; height: 19px; border: 2px solid #cbd0d2; border-radius: 50%; background: #fff; } .step:not(:last-child) .dot::after { position: absolute; top: 18px; left: 7px; width: 2px; height: 57px; background: #dedede; content: ''; } .complete .dot { border-color: #17834b; background: #17834b; box-shadow: inset 0 0 0 4px #fff; } .current .dot { border-color: #e95720; background: #e95720; box-shadow: 0 0 0 4px #fde4da; } .step strong, .step small { display: block; } .step small { margin-top: 4px; color: #747a80; font-size: 12px; line-height: 1.3; } .time { color: #777d82; font-size: 12px; } .rider { display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 12px; background: #fff8f4; } .avatar { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 50%; color: #fff; background: #e95720; font-weight: 700; } .rider-copy { flex: 1; } .rider-copy strong, .rider-copy small { display: block; } .rider-copy small { margin-top: 4px; color: #6e747a; } .call { padding: 10px 12px; border: 0; border-radius: 8px; color: #df5019; background: #fff; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main class="app"><header><button class="back" aria-label="Go back" onclick="history.back()">‹</button><h1>Track order</h1></header>
        <div class="map" aria-label="Delivery route map"><div class="road"></div><div class="road two"></div><div class="route"></div><span class="pin restaurant">🍕</span><span class="pin home">⌂</span></div>
        <section class="summary"><p>{{ order.number }} · {{ order.restaurant }}</p><strong>Arriving in <span class="eta">{{ order.eta }}</span></strong><p>{{ order.address }}</p></section>
        <section class="section"><h2>Order status</h2><div class="timeline">{% for step in order.steps %}<article class="step {{ step.state }}"><span class="dot"></span><div><strong>{{ step.title }}</strong><small>{{ step.detail }}</small></div><span class="time">{{ step.time }}</span></article>{% endfor %}</div></section>
        <section class="section"><h2>Your delivery partner</h2><div class="rider"><span class="avatar">AK</span><div class="rider-copy"><strong>{{ order.rider }}</strong><small>★ {{ order.rider_rating }} rating</small></div><button class="call" id="call-rider">Call</button></div></section>
    </main>
    <script>document.getElementById('call-rider').onclick = event => { event.currentTarget.textContent = 'Calling…'; };</script>
</body>
</html>
