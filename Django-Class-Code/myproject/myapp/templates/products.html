<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    {% load static %}
    <h1>Product List</h1>
    <div class="product-container">
        {% for product in products %}
            <div class="product">
                <h2>{{ product.name }}</h2>
                <p>Brand: {{ product.brand }}</p>
                <p>Price: ${{ product.price }}</p>
                <img src="{% static product.image %}" alt="{{ product.name }}" width="200" height="200">
            </div>
        {% endfor %}
    </div>
</body>
</html>
