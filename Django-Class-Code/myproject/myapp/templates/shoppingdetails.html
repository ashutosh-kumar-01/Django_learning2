<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% load static %}
    <img src="{% static product.image %}" alt="{{ product.name }}" width="200" height="200">
    <h1>{{ product.name }}</h1>
    <p>Brand: {{ product.brand }}</p>
    <p>Price: ${{ product.price }}</p>
    <p><a href="{% url 'shoppinglist' %}">Back to products</a></p>
</body>
</html>
