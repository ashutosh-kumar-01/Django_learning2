<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert blog post</title>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Create blogpost">
    </form>
    {% if blog_created %}
        <p>Blog post created successfully!</p>
        <p><a href="{% url 'blogposts' %}">View all blog posts</a></p>
        <img src="{{ blog_post.thumbnail.url }}" alt="{{ blog_post.title }} thumbnail" width="250">
    {% endif %}
</body>
</html>
