<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog posts</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .posts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
        .post { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; padding: 1rem; }
        .post img { display: block; width: 100%; height: 180px; object-fit: cover; margin-bottom: 1rem; }
        .no-image { color: #666; }
    </style>
</head>
<body>
    <h1>All blog posts</h1>

    {% if posts %}
        <div class="posts">
            {% for post in posts %}
                <article class="post">
                    {% if post.thumbnail %}
                        <img src="{{ post.thumbnail.url }}" alt="Thumbnail for {{ post.title }}">
                    {% else %}
                        <p class="no-image">No image uploaded.</p>
                    {% endif %}
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.post }}</p>
                </article>
            {% endfor %}
        </div>
    {% else %}
        <p>No blog posts have been created yet.</p>
    {% endif %}
</body>
</html>
