<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Publisher Book List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; min-width: 620px; }
        th, td { border: 1px solid #bbb; padding: .65rem; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Publisher Book List</h2>
    <h3>Total Books: {{ total }}</h3>

    <table>
        <tr>
            <th>Title</th><th>Author</th><th>ISBN</th><th>Year</th><th>Action</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author.name }}</td>
            <td>{{ book.isbn }}</td>
            <td>{{ book.publication_year }}</td>
            <td><a href="{% url 'library:update_book' book.id %}">Update</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No books have been added yet.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
